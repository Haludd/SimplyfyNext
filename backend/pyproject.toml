[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "simplynext-backend"
version = "0.1.0"
description = "Uncertainty-aware GlossLattice translation backend for SimplyNext"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3>=1.35,<2",
    "anthropic>=0.104,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph==1.2.11",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "websockets>=14,<17",
]

[project.scripts]
simplynext-api = "simplynext.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/simplynext"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["simplynext"]
