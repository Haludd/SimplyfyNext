server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(self)" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # Flutter's entrypoint filenames are stable across releases. Revalidate them
  # on every load so a redeploy cannot leave an older compiled Dart gate in a
  # browser cache for a day.
  location ~* \.(?:js|json)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location ~* \.(?:onnx|wasm|css|png)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
  }
}
