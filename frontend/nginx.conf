map $http_upgrade $signbridge_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(self)" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # The hosted Flutter build uses this same-origin gateway for both HTTP and
  # WebSocket room traffic. The browser therefore never depends on a separate
  # backend CORS allow-list. Origin is removed at this trusted boundary; the
  # backend already accepts origin-less native clients and room capabilities
  # remain mandatory for every authenticated operation.
  location /v1/ {
    proxy_pass __SIGNBRIDGE_API_BASE_URL__;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $signbridge_connection_upgrade;
    proxy_set_header Origin "";
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # Flutter's entrypoint filenames are stable across releases. Revalidate them
  # on every load so a redeploy cannot leave an older compiled Dart gate in a
  # browser cache for a day.
  location ~* \.(?:js|json)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location ~* \.(?:onnx|wasm|css|png)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
  }
}
