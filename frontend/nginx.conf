server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(self)" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # Flutter's app shell (main.dart.js, the service worker, version/manifest
  # json, the site's own hand-tracking/recognizer scripts) has no content
  # hash in its filename, so a stale cached copy is indistinguishable from
  # the current one to the browser. A day-long max-age here meant a
  # successful deploy could sit unnoticed in a returning visitor's cache for
  # up to 24 hours — always revalidate these instead.
  location ~* \.(?:js|css|json)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  # Large, effectively immutable model and image assets are safe to cache.
  location ~* \.(?:onnx|wasm|png)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
  }
}
